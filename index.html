<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>melobookkss ♡ kitaplar</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#ffe3ef; --bg2:#ffc8de; --dot:#ffffff99;
  --card:#ffffff94; --ink:#7a2347; --soft:#b0587f;
  --pink:#ff7eb3; --red:#e8416f; --line:#ffb3d1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#3a1530; --bg2:#5a1f45; --dot:#ffffff22;
    --card:#4a1c3baa; --ink:#ffe3ef; --soft:#f7a9c9;
    --line:#b93881;
  }
}
:root[data-theme="dark"]{
  --bg1:#3a1530; --bg2:#5a1f45; --dot:#ffffff22;
  --card:#4a1c3baa; --ink:#ffe3ef; --soft:#f7a9c9; --line:#8a3a68;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center;
  padding:96px 16px 110px;
  font-family:'Fredoka','Trebuchet MS',sans-serif; color:var(--ink);
  background:#fdbbe1 linear-gradient(180deg, #f18bc1 0%, #fda4d6 10%, #fdb0de 20%, #ffb7df 30%, #fdbbe1 40%, #fdbfe4 50%, #fdbbe1 60%, #ffb7df 70%, #fdb0de 80%, #faa6d7 90%, #fd90c9 100%) fixed;
}
.wrap{width:100%; max-width:440px; text-align:center; position:relative}
.card{
  background:var(--card); border:3px solid var(--line); border-radius:36px;
  padding:56px 22px 26px; margin-top:34px; position:relative;
  box-shadow:0 10px 0 var(--line), 0 24px 40px #e8416f2e;
}
.bow{position:absolute; top:-34px; left:50%; transform:translateX(-50%); width:96px}
.avatar{
  width:112px; height:112px; margin:0 auto 14px; border-radius:50%;
  background:linear-gradient(135deg,#fff,#ffd3e5); border:4px solid var(--pink);
  display:grid; place-items:center; font-size:52px;
  box-shadow:0 0 0 6px #ff7eb340;
}
h1{font-family:'Pacifico','Brush Script MT',cursive; font-weight:400; font-size:38px; margin:6px 0 2px; color:var(--red)}
.handle{color:var(--soft); font-weight:500; margin:0 0 24px}
.tag{margin:0 0 24px; font-size:17px}
.links{display:grid; gap:12px}
.link{
  display:flex; align-items:center; gap:14px; text-align:left; text-decoration:none;
  color:var(--ink); background:#ffffffdd; border:2.5px solid var(--line); border-radius:999px;
  padding:10px 18px 10px 10px; box-shadow:0 4px 0 var(--line);
  transition:transform .15s, box-shadow .15s;
}
.link:hover,.link:focus-visible{transform:translateY(-3px); box-shadow:0 7px 0 var(--pink); outline:none; border-color:var(--pink)}
.link:active{transform:translateY(2px); box-shadow:0 1px 0 var(--line)}
.ico{
  width:46px; height:46px; flex:none; border-radius:50%; display:grid; place-items:center;
  font-size:23px; background:linear-gradient(135deg,#ffe3ef,#ffc2da);
}
.txt{flex:1; min-width:0; color:#7a2347}
.txt b{display:block; font-weight:600; font-size:17px}
.txt small{display:block; color:#b0587f; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.heart{color:var(--pink); font-size:20px}
footer{margin-top:24px; display:inline-block; padding:7px 18px; font-size:14px; font-weight:500; color:#8a2a58;
  background:#ff7eb338; border:1.5px solid #ff7eb36e; border-radius:999px}
.float{position:fixed; pointer-events:none; font-size:22px; opacity:.7; animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}.link{transition:none}}

body::before,body::after{content:""; position:fixed; left:0; right:0; height:34px; z-index:0; pointer-events:none;
  background:url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%2276%22%20height=%2234%22%20viewBox=%220%200%2076%2034%22%3E%3Cpath%20d=%22M0%2028A38%2022%200%200%201%2076%2028%22%20fill=%22none%22%20stroke=%22%23d81b60%22%20stroke-width=%226%22/%3E%3Cpath%20d=%22M0%2028A38%2022%200%200%201%2076%2028%22%20fill=%22none%22%20stroke=%22%23ff7eb3%22%20stroke-width=%222%22%20stroke-dasharray=%222%203%22/%3E%3C/svg%3E") repeat-x center top/76px 34px}
body::before{top:calc(44px + env(safe-area-inset-top,0px))}
body::after{bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{z-index:1}
.kitty{display:block; width:200px; height:auto; margin:26px auto 0; filter:drop-shadow(0 6px 10px #e8416f40)}

.link{position:relative; overflow:hidden; -webkit-tap-highlight-color:transparent}
.link:active{transform:translateY(2px) scale(.97)}
.link:hover .heart,.link:focus-visible .heart{animation:beat .6s ease infinite}
@keyframes beat{50%{transform:scale(1.35)}}
.ripple{position:absolute; border-radius:50%; background:#ff7eb35c; transform:scale(0); pointer-events:none; animation:rip .6s ease-out forwards}
@keyframes rip{to{transform:scale(1); opacity:0}}
.spark{position:fixed; z-index:50; pointer-events:none; font-size:18px; user-select:none}
@media (prefers-reduced-motion:reduce){.ripple,.spark{display:none}.link:hover .heart{animation:none}}

<script>
(function(){
  var marks=['♡','✦','♥','✿','✧'], cols=['#ff4f93','#ff7eb3','#e8416f','#ffb3d1','#d6336c'];
  function burst(x,y){
    for(var i=0;i<12;i++){
      var e=document.createElement('span'); e.className='spark';
      e.textContent=marks[i%5]; e.style.left=x+'px'; e.style.top=y+'px';
      e.style.color=cols[i%5]; e.style.fontSize=(14+Math.random()*12)+'px';
      document.body.appendChild(e);
      var a=Math.PI*2*i/12+Math.random()*.5, d=40+Math.random()*50;
      var an=e.animate([
        {transform:'translate(-50%,-50%) scale(.3)',opacity:1},
        {transform:'translate(calc(-50% + '+Math.cos(a)*d+'px),calc(-50% + '+(Math.sin(a)*d-18)+'px)) scale(1.1) rotate('+(Math.random()*120-60)+'deg)',opacity:0}
      ],{duration:700+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'});
      an.onfinish=(function(el){return function(){el.remove()}})(e);
    }
  }
  document.querySelectorAll('.link').forEach(function(l){
    l.addEventListener('pointerdown',function(ev){
      if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
      var r=l.getBoundingClientRect(), size=Math.max(r.width,r.height)*2;
      var rp=document.createElement('span'); rp.className='ripple';
      rp.style.width=rp.style.height=size+'px';
      rp.style.left=(ev.clientX-r.left-size/2)+'px'; rp.style.top=(ev.clientY-r.top-size/2)+'px';
      l.appendChild(rp); setTimeout(function(){rp.remove()},650);
      burst(ev.clientX,ev.clientY);
    });
  });
})();
</script>
<script>
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  var m=['♡','♥','✦','✿','✧'], c=['#ff4f93','#ff7eb3','#e8416f','#ffffff','#d6336c'];
  for(var i=0;i<5;i++){
    var e=document.createElement('span'); e.className='spark';
    e.textContent=m[i%5]; e.style.top='0'; e.style.left=(Math.random()*96+2)+'vw';
    e.style.color=c[i%5]; e.style.fontSize=(14+Math.random()*14)+'px';
    document.body.appendChild(e);
    var dx=(Math.random()*80-40), an=e.animate([
      {transform:'translate(0,-30px) rotate(0deg)',opacity:0},
      {opacity:1,offset:.15},
      {transform:'translate('+dx+'px,'+(innerHeight*0.9)+'px) rotate('+(Math.random()*360-180)+'deg)',opacity:0}
    ],{duration:2600+Math.random()*1800,delay:Math.random()*1200,easing:'ease-in',fill:'backwards'});
    an.onfinish=(function(el){return function(){el.remove()}})(e);
  }
})();
</script>
